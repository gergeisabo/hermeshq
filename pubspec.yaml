name: hermeshq
description: Native macOS & iOS companion for Hermes Agent Dashboard.
  Displays your Hermes dashboard in a native WebView with
  connectivity monitoring, menubar status, and notifications.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  window_manager: ^0.4.0
  flutter_local_notifications: ^18.0.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
